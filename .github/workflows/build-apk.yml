
name: Build LUMEN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LUMEN-listo-para-APK.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q LUMEN-listo-para-APK.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Detect Gradle version
        id: gradle
        run: |
          FILE=$(find source -name gradle-wrapper.properties | head -1)
          VERSION=$(grep distributionUrl "$FILE" | sed -E 's/.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
                    packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
